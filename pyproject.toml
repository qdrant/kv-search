[project]
name = "kv-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.14.0",
    "datasets>=4.8.5",
    "flash-attn>=2.8.3.post1; sys_platform == 'linux'",
    "matplotlib>=3.11.0",
    "mistral-common>=1.11.3",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "qdrant-client>=1.18.0",
    "safetensors>=0.7.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "transformers>=5.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
no-build-isolation-package = ["flash-attn"]
extra-build-dependencies = { flash-attn = ["ninja"] }
# This is somewhat nvidia spark specific but whatever
extra-build-variables = { flash-attn = { MAX_JOBS = "16", FLASH_ATTN_CUDA_ARCHS = "120" } }

[dependency-groups]
dev = [
    "ninja>=1.13.0",
]
